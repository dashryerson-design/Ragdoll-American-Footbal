 if(c.st==='idle'&&held&&callReq){const R=bpt(chest,-.2,.5,0),Q0=callReq.P,W=callReq.V,delay=.55;let tf=1;
  for(let i=0;i<4;i++){const tx=Q0.x+W.x*(delay+tf),tz=Q0.z+W.z*(delay+tf);tf=cl(Math.hypot(tx-R.x,tz-R.z)/17,.6,3);}   // flight time from distance, re-solved for where he'll be
  c.T=new V(Q0.x+W.x*(delay+tf),1.25,Q0.z+W.z*(delay+tf));
  {const dx=c.T.x-R.x,dz=c.T.z-R.z,L=Math.hypot(dx,dz)||1,fx=dx/L,fz=dz/L,r=Math.random();   // the QB isn't perfect: usually a little off, about 1 in 3 sails 1.5-3 m long (dive for it)
   const long=r<.33?1.5+Math.random()*1.5:(Math.random()-.5)*.8,side=(Math.random()-.5)*(r<.33?1.6:.8);c.T.x+=fx*long-fz*side;c.T.z+=fz*long+fx*side;}c.arrive=qbClock+delay+tf;c.st='aim';c.t=0;aimOn=true;callReq=null;}
 if(c.T&&c.st!=='idle'){fx=c.T.x;fz=c.T.z;}
 camYaw=Math.atan2(fx-pel.position.x,fz-pel.position.z)+Math.PI;      // the body turns to face camYaw + 180°
 if(c.st==='aim'&&(c.t+=dt)>.35){startThrow();c.st='throw';}
 if(c.st==='throw'&&thr<0){c.st='idle';}}
// refresh: QB back on his spot with the ball (for a missed catch)
function refreshQB(){if(!teammate||!mode||paused)return;use(player);if(held){held=false;aimOn=false;thr=-1;}use(qbD);reset();held=false;aimOn=false;thr=-1;cur.st='idle';cur.T=null;use(player);callReq=null;giveQB();}
$m('brst').addEventListener('click',refreshQB);$m('brst').addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();refreshQB();},{passive:false});
// ---------- touch layout editor: drag controls to move them, tap + -/+ to resize; saved on this device ----------
const LAY_IDS=['joy','bbig','baim','bjump','bdrop','bsprint','tpause','bdive'],LAY_KEY='rafTouchLayout',layOrig={};
for(const id of LAY_IDS)layOrig[id]=$m(id).getAttribute('style')||'';
let lay={},editing=false,selId=null,drag=null;try{lay=JSON.parse(localStorage.getItem(LAY_KEY)||'{}')||{};}catch(e){}
function applyLay(){for(const id of LAY_IDS){const el=$m(id),L=lay[id];el.setAttribute('style',layOrig[id]);if(id==='joy')$m('knob').removeAttribute('style');if(!L)continue;   // saved as a fraction of the screen, so it survives rotation / other screens
 Object.assign(el.style,{left:(L.x*innerWidth-L.s/2)+'px',top:(L.y*innerHeight-L.s/2)+'px',right:'auto',bottom:'auto',width:L.s+'px',height:L.s+'px',fontSize:Math.max(10,L.s*.19)+'px'});
 if(id==='joy'){const k=L.s*.41;Object.assign($m('knob').style,{width:k+'px',height:k+'px',margin:(-k/2)+'px 0 0 '+(-k/2)+'px'});}}}
function layOf(id){const r=$m(id).getBoundingClientRect();return lay[id]||{x:(r.left+r.width/2)/innerWidth,y:(r.top+r.height/2)/innerHeight,s:r.width};}
function selectCtl(id){if(selId)$m(selId).classList.remove('esel');selId=id;if(id)$m(id).classList.add('esel');}
function saveLay(){try{localStorage.setItem(LAY_KEY,JSON.stringify(lay));}catch(e){}}
applyLay();addEventListener('resize',applyLay);
addEventListener('touchstart',e=>{if(!editing)return;const t=e.changedTouches[0],el=t.target.closest&&t.target.closest('#joy,.tb');if(!el||!LAY_IDS.includes(el.id))return;
 e.preventDefault();e.stopPropagation();selectCtl(el.id);const L=layOf(el.id);drag={id:el.id,ox:t.clientX-L.x*innerWidth,oy:t.clientY-L.y*innerHeight,s:L.s,tid:t.identifier};},{capture:true,passive:false});   // capture: the control's own action never fires while editing
addEventListener('touchmove',e=>{if(!editing||!drag)return;e.preventDefault();e.stopPropagation();for(const t of e.changedTouches){if(t.identifier!==drag.tid)continue;const h=drag.s/2;
 lay[drag.id]={x:cl(t.clientX-drag.ox,h,innerWidth-h)/innerWidth,y:cl(t.clientY-drag.oy,h,innerHeight-h)/innerHeight,s:drag.s};applyLay();}},{capture:true,passive:false});
addEventListener('touchend',e=>{if(editing){drag=null;e.stopPropagation();}},{capture:true});
const resize=d=>{if(!selId)return;const L=layOf(selId);lay[selId]={...L,s:cl(L.s+d,40,200)};applyLay();};
$m('edm').onclick=()=>resize(-10);$m('edp').onclick=()=>resize(10);

// ---------- main loop: fixed 400 Hz physics, muscles driven every step ----------
const DT=1/400;let acc=0,last=performance.now();
const tgt=new THREE.Vector3(0,1,0);let camCD=3.6;
function frame(now){
 requestAnimationFrame(frame);
 if(!mode){last=now;return;}                                  // main menu: nothing of the game is drawn
 if(paused){last=now;renderer.render(scene,cam);return;}        // paused: frozen frame, no physics
 acc+=Math.min(.05,(now-last)/1000);last=now;if(window.DBGFREEZE)acc=0;   // test hook
 const D=active();
 for(const d of D){use(d);sense();}
 while(acc>=DT){
  for(const d of D){use(d);if(cur.ai)(cur.role==='wr'?wrThink:qbThink)(DT);control(DT);for(const k in joints)drive(joints[k]);}
  world.step(DT);acc-=DT;
  for(const d of D){use(d);for(const b of list){b.computeAABB();const pen=-b.aabb.lowerBound.y;if(pen>.004){b.position.y+=pen;if(b.velocity.y<0)b.velocity.y=0;}const w=b.angularVelocity,m=w.norm();if(m>25)w.scale(25/m,w);if(!(m===m)||!isFinite(b.position.x)||!isFinite(b.position.y)){reset();break;}}}}
 for(const d of D){use(d);for(const b of list){b.mesh.position.copy(b.position);b.mesh.quaternion.copy(b.quaternion);}}
 use(player);ballTick(now);aimTick();$m('cboost').hidden=catchBoost()===1;
 tgt.x+=(pel.position.x-tgt.x)*.45;tgt.z+=(pel.position.z-tgt.z)*.45;tgt.y+=(Math.max(.4,pel.position.y-.08)-tgt.y)*.1;   // follow the doll tightly (incl. height on platforms)
 const sh=.55,pvx=tgt.x+Math.cos(camYaw)*sh,pvy=tgt.y+.55,pvz=tgt.z-Math.sin(camYaw)*sh,cp=Math.cos(camPitch);   // pivot: over the doll's right shoulder
 const dx=Math.sin(camYaw)*cp,dy=Math.sin(camPitch),dz=Math.cos(camYaw)*cp,rc=castRay({x:pvx,y:pvy,z:pvz},{x:dx,y:dy,z:dz},camDist+.2);
 const cd=rc.hit?Math.max(.6,Math.hypot(rc.p.x-pvx,rc.p.y-pvy,rc.p.z-pvz)-.2):camDist;
 camCD+=(cd-camCD)*(cd<camCD?.5:.06);                   // move in quickly when blocked, ease back out slowly (no snapping)
 cam.position.set(pvx+dx*camCD,Math.max(.2,pvy+dy*camCD),pvz+dz*camCD);cam.lookAt(pvx,pvy,pvz);
 {const hold=wrMode&&routeVis&&keys['1']&&performance.now()-routeDownT>250&&route;if(hold!==routeFull)routeShape(!!hold);   // holding 1: rise to a bird's-eye view of the whole route
  birdK+=((hold?1:0)-birdK)*Math.min(1,(now-(frame.lt||now))/1000*3.5);frame.lt=now;
  if(birdK>.001&&route){const xs=[WR_X,...route.map(p=>p[0])],zs=[0,...route.map(p=>p[1])],cx=(Math.min(...xs)+Math.max(...xs))/2,cz=(Math.min(...zs)+Math.max(...zs))/2,span=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...zs)-Math.min(...zs),20);
   const k=birdK*birdK*(3-2*birdK),bp=new THREE.Vector3(cx,span*1.15+8,cz-span*.35),lk=new THREE.Vector3(cx,0,cz);
   const look=new THREE.Vector3(pvx,pvy,pvz).lerp(lk,k);cam.position.lerp(bp,k);cam.lookAt(look);}}
 if(window.DBGCAM){cam.position.set(pel.position.x+DBGCAM[0],DBGCAM[1],pel.position.z+DBGCAM[2]);cam.lookAt(pel.position.x,.8,pel.position.z);}   // test hook: side view
 sun.position.set(pel.position.x+5,12,pel.position.z+4);sun.target.position.set(pel.position.x,0,pel.position.z);
 renderer.render(scene,cam);
}
